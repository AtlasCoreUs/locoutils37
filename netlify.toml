[build]
command = "node build-config.js"
publish = "."
functions = "netlify/functions"

[functions]
node_bundler = "esbuild"
included_files = ["data/tools.json"]

[build.environment]
NODE_VERSION = "20"
SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL,SUPABASE_ANON_KEY,STRIPE_PUBLIC_KEY,SITE_URL"

[dev]
command = "node build-config.js"
publish = "."
functions = "netlify/functions"
port = 8888

[[headers]]
for = "/*"
[headers.values]
X-Content-Type-Options = "nosniff"
X-Frame-Options = "DENY"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "camera=(), microphone=(), geolocation=()"
Content-Security-Policy = "default-src 'self'; script-src 'self' https://js.stripe.com; frame-src https://js.stripe.com https://hooks.stripe.com; connect-src 'self' https://api.stripe.com https://*.supabase.co; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; base-uri 'self'; form-action 'self' https://checkout.stripe.com; frame-ancestors 'none'"

[[headers]]
for = "/data/tools.json"
[headers.values]
Cache-Control = "public, max-age=300"

[[redirects]]
